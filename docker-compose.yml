# Router + the initial "blue" slot. nginx is long-lived and never torn
# down by a self-deploy -- only reloaded -- so it owns the shared network
# and the backend's sqlite volume here. The alternate slot (built and
# health-checked by the blue_green_deploy workflow step before nginx cuts
# traffic over to it) is brought up separately via docker-compose.app.yml,
# which joins these same network/volume by name. See README for the
# one-time bootstrap sequence.
services:
  backend:
    container_name: backend-blue
    build:
      context: ./backend
    environment:
      # The mounted /srv/repos trees are owned by the host user, not root
      # (who this container runs as) — tell git to trust them regardless of
      # owner instead of refusing every git_pull step with "dubious ownership".
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    volumes:
      - backend-data:/app/data
      # The workflow engine's steps (git_pull, npm_install/build, docker_build)
      # shell out inside this container using the `cwd` you set per step, e.g.
      # /srv/repos/my-app. Point this at wherever your app repos actually live
      # on the host so those paths resolve; adjust the left-hand side to match.
      - /srv/repos:/srv/repos
      # Lets the docker_build step (and CapRover's own webhook, which builds
      # on the host) talk to the host's Docker daemon from inside this container.
      # The blue_green_deploy step also uses this to build/start the other
      # slot and to `docker exec` nginx for the cutover reload.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - deploybutton-net
    restart: unless-stopped

  frontend:
    container_name: frontend-blue
    build:
      context: ./frontend
    networks:
      - deploybutton-net
    restart: unless-stopped

  nginx:
    container_name: nginx
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks:
      - deploybutton-net
    restart: unless-stopped

networks:
  deploybutton-net:
    name: deploybutton-net

volumes:
  backend-data:
    name: deploybutton-backend-data
