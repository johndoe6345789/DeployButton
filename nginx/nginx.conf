events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolver. Needed because the proxy_pass targets
    # below are variables (set by the included active-upstream.conf) --
    # nginx only re-resolves a variable proxy_pass target per-request via an
    # explicit resolver, unlike a plain `proxy_pass http://backend;`, which
    # it would resolve once at startup and cache for the container's life.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        client_max_body_size 20m;

        # Which slot (blue/green) is currently live. Rewritten and reloaded
        # in place by the blue_green_deploy step once it's health-checked
        # the new slot -- `nginx -s reload` picks this up without dropping
        # in-flight connections or recreating this container.
        include /etc/nginx/active/active-upstream.conf;

        # No trailing path on proxy_pass, so nginx forwards the original
        # request URI unchanged -- this must line up with the backend's own
        # routes, which are all registered under /api/... already.
        location /api/ {
            proxy_pass http://$active_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://$active_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
